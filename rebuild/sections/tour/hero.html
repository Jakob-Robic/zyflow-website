<section class="tour-hero section" data-section="tour.hero">
  <div class="container">
    <div class="tour-hero__panel">
      <div class="tour-hero__copy">
        <p class="tour-hero__crumb">
          <a href="./tours.html" data-i18n="tour.hero.crumbParent">Routes</a>
          <span class="motif" aria-hidden="true"></span>
          <span data-i18n="routes.__SLUG__.crumbType">Touring</span>
        </p>
        <h1 class="tour-hero__title" data-i18n-html="routes.__SLUG__.titleHtml">route</h1>
        <p class="tour-hero__lede" data-i18n="routes.__SLUG__.lede"></p>
        <div class="tour-hero__foot">
          <p class="tour-hero__price"><span data-i18n="routes.__SLUG__.price"></span><span data-i18n="routes.__SLUG__.unit"></span></p>
          <div class="tour-hero__cta">
            <div class="tour-hero__next">
              <span data-i18n="routes.__SLUG__.nextLabel">Best season</span>
              <strong data-i18n="routes.__SLUG__.nextValue">Apr – Oct</strong>
            </div>
            <a class="btn btn--primary" href="__DEEP_LINK__" data-i18n="routes.__SLUG__.cta">Open in Zyflow</a>
            <a class="btn btn--secondary" href="{{appStoreUrl}}" data-app-modal-open data-i18n="routes.__SLUG__.ctaSecondary">Get the app</a>
          </div>
        </div>
      </div>
      <div class="tour-hero__media tour-hero__media--map">
        <div
          class="tour-hero__map"
          id="tour-hero-map"
          data-tour-map
          data-gpx="__GPX__"
          data-slug="__SLUG__"
          role="img"
          aria-label="Route map"
        ></div>
        <script type="application/json" data-tour-route-json>__ROUTE_JSON__</script>
        <noscript>
          <img src="__COVER__" alt="" />
        </noscript>
      </div>
    </div>

    <div class="tour-meta">
      <div class="tour-meta__box tour-meta__box--accent">
        <p class="tour-meta__value" data-i18n="routes.__SLUG__.place"></p>
        <p class="tour-meta__label"><img src="./assets/images/icons/location.svg" alt="" aria-hidden="true" width="18" height="18" /><span data-i18n="routes.__SLUG__.coords"></span></p>
      </div>
      <div class="tour-meta__box">
        <p class="tour-meta__value" data-i18n-html="routes.__SLUG__.durationHtml"></p>
        <p class="tour-meta__label"><span class="motif" aria-hidden="true"></span><span data-i18n="routes.__SLUG__.durationLabel">Duration</span></p>
      </div>
      <div class="tour-meta__box">
        <p class="tour-meta__value" data-i18n="routes.__SLUG__.difficulty"></p>
        <p class="tour-meta__label"><span class="motif" aria-hidden="true"></span><span data-i18n="routes.__SLUG__.difficultyLabel">Difficulty</span></p>
      </div>
      <div class="tour-meta__box">
        <p class="tour-meta__value" data-i18n="routes.__SLUG__.climb"></p>
        <p class="tour-meta__label"><span class="motif" aria-hidden="true"></span><span data-i18n="routes.__SLUG__.climbLabel">Elevation</span></p>
      </div>
    </div>
  </div>
</section>
