<section class="hero section" data-section="home.hero">
  <div class="hero__frame">
    <div class="hero__media" aria-hidden="true">
      <img src="./assets/images/home/hero.jpg" alt="Cyclist riding a scenic road" />
      <div class="hero__scrim"></div>
    </div>
    <div class="hero__content">
      <div class="hero__head">
        <h1 class="hero__h1" data-i18n-html="home.hero.titleHtml">bike-friendly stays, cafés and chargers for cyclists</h1>
        <p class="hero__title" data-i18n-html="home.hero.brandHtml">explore<br />further.</p>
      </div>
      <p class="hero__sub" data-i18n="home.hero.subtitle">Smart navigation for cyclists and e-bike riders. Battery, elevation, and weather before you leave.</p>
      <a class="btn btn--primary" href="{{appStoreUrl}}" data-app-modal-open data-i18n="home.hero.cta">Plan your first route</a>
    </div>
    <aside class="hero__card">
      <div class="hero__card-media">
        <img class="hero__card-thumb" src="./assets/images/home/hero-thumb.jpg" alt="Ljubljana to Trieste route" />
      </div>
      <div class="hero__card-body">
        <div class="hero__card-label"><span class="motif" aria-hidden="true"></span><span data-i18n="home.hero.nextDepartureLabel">Featured Route</span></div>
        <div>
          <p class="hero__card-title" data-i18n="home.hero.nextDepartureTitle">Ljubljana to Trieste</p>
          <p class="hero__card-date" data-i18n="home.hero.nextDepartureDate">134 km · +1,766 m</p>
        </div>
      </div>
    </aside>
  </div>
</section>
