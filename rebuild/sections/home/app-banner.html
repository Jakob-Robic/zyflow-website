<!--
  APP BANNER: identity beat under hero (featured-tour pattern).
  REVERT: remove include from pages/home.html (with other app-* / home-app.css).
-->
<section class="app-banner section" data-section="home.appBanner">
  <div class="container">
    <div class="app-banner__phone">
      <div class="phone phone--banner phone--shot">
        <div class="phone__bezel">
          <div class="phone__screen phone-ui phone-ui--shot">
            <img data-i18n-attr="alt:alts.appMap"
              class="phone-ui__shot"
              src="./assets/images/home/app-map.jpg"
              alt="Zyflow app map showing bike-friendly places, chargers and water points"
              width="390"
              height="844"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </div>
      <div class="app-banner__polaroid app-banner__polaroid--1 polaroid">
        <img data-i18n-attr="alt:alts.polaroid1" src="./assets/images/home/polaroid-1.jpg" alt="Two cyclists riding a rocky mountain trail" />
      </div>
      <div class="app-banner__polaroid app-banner__polaroid--2 polaroid">
        <img src="./assets/images/home/forest-boardwalk.jpg" alt="Bike handlebars on a forest boardwalk" />
      </div>
    </div>

    <div class="app-banner__below">
      <div class="app-banner__panel">
        <div class="app-banner__bg" aria-hidden="true">
          <img src="./assets/images/home/map-contours-featured.svg" alt="" aria-hidden="true" />
        </div>

        <div class="app-banner__copy">
          <p class="app-banner__eyebrow" data-i18n="home.appBanner.eyebrow">The Zyflow app</p>
          <h2 class="app-banner__title" data-i18n-html="home.appBanner.titleHtml">Built for the<br />ride, not a tour desk.</h2>
          <p class="app-banner__body" data-i18n="home.appBanner.body">
            Free navigation for cyclists and e-bike riders. Plan with battery, elevation, chargers, and weather before you leave.
          </p>
          <div class="app-banner__ctas">
            <a class="btn btn--primary" href="{{appStoreUrl}}" data-app-modal-open data-i18n="home.appBanner.cta">Download</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
