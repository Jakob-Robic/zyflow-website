<section class="tours-grid section" data-section="tours.grid">
  <div class="container">
    <div class="tours-filters" data-tours-filters data-i18n-attr="data-remove-label:tours.filters.remove" data-remove-label="Remove filter" hidden>
      <div class="tours-filters__chips" data-tours-chips></div>
      <button type="button" class="link tours-filters__clear" data-tours-clear data-i18n="tours.filters.clear">Clear filters</button>
    </div>
    <p class="visually-hidden" role="status" aria-live="polite" data-tours-status data-i18n-attr="data-one:tours.filters.countOne;data-other:tours.filters.countOther" data-one="route" data-other="routes"></p>
    <!-- Every route card is rendered here from the route data (routes-places.js); cards after the first page wait for "Show more". -->
    <div class="tours-grid__list" data-tours-grid data-page-size="{{toursPageSize}}">
<!-- TOURS_GRID_CARDS -->
    </div>
    <noscript><style>.tours-grid__list .tour-card.is-paged-out { display: flex; } [data-tours-more] { display: none; }</style></noscript>
    <div class="tours-grid__more">
      <button type="button" class="btn btn--secondary" data-tours-more data-i18n="tours.filters.more"{{toursMoreHidden}}>Show more routes</button>
    </div>
    <div class="tours-grid__empty" data-tours-empty hidden>
      <p data-i18n="tours.empty">No routes here yet. New rides are added as we map more bike-friendly places.</p>
      <button type="button" class="btn btn--secondary" data-tours-clear data-i18n="tours.filters.clear">Clear filters</button>
    </div>
  </div>
</section>
