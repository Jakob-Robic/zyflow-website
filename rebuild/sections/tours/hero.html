<section class="tours-hero section" data-section="tours.hero">
  <div class="tours-hero__glow" aria-hidden="true">
    <img src="./assets/images/home/map-contours-featured.svg" alt="" aria-hidden="true" />
  </div>
  <div class="container">
    <div class="tours-hero__top">
      <div class="tours-hero__copy">
        <p class="tours-hero__eyebrow" data-i18n="tours.hero.eyebrow">our routes</p>
        <h1 class="tours-hero__title" data-i18n="tours.hero.title">cycling routes past bike-friendly stops</h1>
        <p class="tours-hero__lede" data-i18n="tours.hero.lede">
          Example rides across countries we cover today — and a preview of the continent and country route library Zyflow is building.
        </p>
      </div>
      <div class="tours-hero__quals" aria-label="Zyflow highlights">
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.0">Battery-aware routing</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.1">7,400+ chargers mapped</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.2">iOS &amp; Android</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.3">Europe coverage growing</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.4">Free to download</span>
        </span>
      </div>
    </div>

    <!-- One filter bar: type (with its icons) and the rows from TOURS_FILTER_GROUPS share the
         Journal's filter chips (.blog-filters); on a phone each row scrolls sideways. -->
    <div class="blog-filters tours-filterbar" data-tours-filterbar>
      <div class="blog-filters__group tours-filters__group" role="group" aria-labelledby="tours-filter-type" data-tours-type>
        <p class="blog-filters__label" id="tours-filter-type" data-i18n="tours.filter.label">Type</p>
        <div class="blog-filters__links tours-filters__links">
          <button type="button" class="blog-filters__btn tours-chip is-active" data-filter="all" aria-pressed="true"><span data-i18n="tours.filter.all">All</span></button>
          <button type="button" class="blog-filters__btn tours-chip" data-filter="tour" aria-pressed="false"><img src="./assets/images/icons/bicycle.svg" alt="" width="20" height="20" aria-hidden="true" /><span data-i18n="tours.filter.tour">Touring</span></button>
          <button type="button" class="blog-filters__btn tours-chip" data-filter="commute" data-requires-category="commute" aria-pressed="false"><img src="./assets/images/icons/buildings.svg" alt="" width="20" height="20" aria-hidden="true" /><span data-i18n="tours.filter.commute">Commute</span></button>
          <button type="button" class="blog-filters__btn tours-chip" data-filter="alpine" aria-pressed="false"><img src="./assets/images/icons/mountains.svg" alt="" width="20" height="20" aria-hidden="true" /><span data-i18n="tours.filter.alpine">Alpine</span></button>
          <button type="button" class="blog-filters__btn tours-chip" data-filter="gravel" aria-pressed="false"><img src="./assets/images/icons/path.svg" alt="" width="20" height="20" aria-hidden="true" /><span data-i18n="tours.filter.gravel">Gravel</span></button>
        </div>
      </div>
      <!-- TOURS_FILTER_GROUPS -->
    </div>
  </div>
</section>
