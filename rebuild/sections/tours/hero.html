<section class="tours-hero section" data-section="tours.hero">
  <div class="tours-hero__glow" aria-hidden="true">
    <img src="./assets/images/home/map-contours-featured.svg" alt="" aria-hidden="true" />
  </div>
  <div class="container">
    <div class="tours-hero__top">
      <div class="tours-hero__copy">
        <p class="tours-hero__eyebrow" data-i18n="tours.hero.eyebrow">our routes</p>
        <h1 class="tours-hero__title" data-i18n="tours.hero.title">cycling routes past bike-friendly stops</h1>
        <p class="tours-hero__lede" data-i18n="tours.hero.lede">
          Example rides across countries we cover today — and a preview of the continent and country route library Zyflow is building.
        </p>
      </div>
      <div class="tours-hero__quals" aria-label="Zyflow highlights">
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.0">Battery-aware routing</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.1">7,400+ chargers mapped</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.2">iOS &amp; Android</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.3">Europe coverage growing</span>
        </span>
        <span class="tours-qual">
          <img src="./assets/images/icons/approved.svg" alt="" width="18" height="18" aria-hidden="true" />
          <span data-i18n="tours.hero.quals.4">Free to download</span>
        </span>
      </div>
    </div>

    <div class="tours-filter" role="tablist" aria-label="Browse routes by type">
      <p class="tours-filter__label" data-i18n="tours.filter.label">browse:</p>
      <div class="tours-filter__links">
        <button type="button" class="tours-filter__btn is-active" data-filter="all" role="tab" aria-selected="true" data-i18n="tours.filter.all">all</button>
        <button type="button" class="tours-filter__btn" data-filter="tour" role="tab" aria-selected="false">
          <img src="./assets/images/icons/bicycle.svg" alt="" width="48" height="48" aria-hidden="true" /><span data-i18n="tours.filter.tour">tour</span>
        </button>
        <button type="button" class="tours-filter__btn" data-filter="commute" data-requires-category="commute" role="tab" aria-selected="false">
          <img src="./assets/images/icons/buildings.svg" alt="" width="48" height="48" aria-hidden="true" /><span data-i18n="tours.filter.commute">commute</span>
        </button>
        <button type="button" class="tours-filter__btn" data-filter="alpine" role="tab" aria-selected="false">
          <img src="./assets/images/icons/mountains.svg" alt="" width="48" height="48" aria-hidden="true" /><span data-i18n="tours.filter.alpine">alpine</span>
        </button>
        <button type="button" class="tours-filter__btn" data-filter="gravel" role="tab" aria-selected="false">
          <img src="./assets/images/icons/path.svg" alt="" width="48" height="48" aria-hidden="true" /><span data-i18n="tours.filter.gravel">gravel</span>
        </button>
      </div>
    </div>
  </div>
</section>
