<!-- analytics -->
<script src="/js/analytics-config.js" defer></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("consent", "default", {
    ad_storage: "denied",
    ad_user_data: "denied",
    ad_personalization: "denied",
    analytics_storage: "denied",
    functionality_storage: "denied",
    personalization_storage: "denied",
    security_storage: "granted",
    wait_for_update: 2000,
  });
  /* Restore prior CookieConsent choice before GTM Init so GA4 can fire. */
  (function () {
    try {
      var match = document.cookie.match(/(?:^|; )cc_cookie=([^;]*)/);
      if (!match) return;
      var cc = JSON.parse(decodeURIComponent(match[1]));
      var cats = cc.categories || [];
      var analytics = cats.indexOf("analytics") !== -1;
      var ads = cats.indexOf("advertisement") !== -1;
      gtag("consent", "update", {
        analytics_storage: analytics ? "granted" : "denied",
        ad_storage: ads ? "granted" : "denied",
        ad_user_data: ads ? "granted" : "denied",
        ad_personalization: ads ? "granted" : "denied",
      });
    } catch (e) {}
  })();
</script>
<!-- Google Tag Manager -->
<script>
  (function (w, d, s, l, i) {
    w[l] = w[l] || [];
    w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
    var f = d.getElementsByTagName(s)[0],
      j = d.createElement(s),
      dl = l != "dataLayer" ? "&l=" + l : "";
    j.async = true;
    j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
    f.parentNode.insertBefore(j, f);
  })(window, document, "script", "dataLayer", "GTM-W8XX2TWZ");
</script>
<!-- End Google Tag Manager -->
<!-- Pin the consent root before cookieconsent.css applies. That sheet is
     non-blocking (media=print), and the library focuses a node inside the
     modal ~100ms after inserting it. Without this, the unstyled modal sits
     at the end of the document and the focus scrolls the page to the footer. -->
<style>
  #cc-main {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    overflow: visible;
    z-index: 2147483647;
  }
  #cc-main .cm {
    position: fixed;
    z-index: 1;
    bottom: 1rem;
    left: 1rem;
    max-width: 24rem;
  }
</style>
<link rel="stylesheet" href="/css/cookieconsent.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="/css/cookieconsent.css" /></noscript>
