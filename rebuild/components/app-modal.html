<!--
  App download modal — opens from [data-app-modal-open] triggers.
-->
<dialog class="app-modal" id="app-modal" aria-labelledby="app-modal-title">
  <div class="app-modal__panel">
    <div class="app-modal__hero">
      <button type="button" class="app-modal__close" data-app-modal-close data-i18n-aria-label="chrome.appModal.close" aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
      <div class="app-modal__bg" aria-hidden="true">
        <img src="./assets/images/home/map-contours-featured.svg" alt="" aria-hidden="true" />
      </div>
      <div class="phone phone--modal phone--shot" aria-hidden="true">
        <div class="phone__bezel">
          <div class="phone__screen phone-ui phone-ui--shot">
            <img
              class="phone-ui__shot"
              src="./assets/images/home/app-route.jpg"
              alt=""
              width="390"
              height="844"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="app-modal__body">
      <h2 class="app-modal__title" id="app-modal-title" data-i18n="chrome.appModal.title">Get the Zyflow app</h2>
      <p class="app-modal__lede" data-i18n="chrome.appModal.lede">
        Free navigation for cyclists and e-bike riders. Plan with battery, elevation, chargers, and weather.
      </p>

      <p class="app-modal__badge">
        <span class="motif" aria-hidden="true"></span>
        <span data-i18n="chrome.appModal.badge">Free on iOS and Android</span>
      </p>

      <div class="app-modal__card">
        <div class="app-modal__download">
          <h3 data-i18n="chrome.appModal.downloadTitle">Download Zyflow now</h3>
          <p data-i18n="chrome.appModal.downloadBody">
            Visit the App Store, Google Play, or scan the QR code with your phone.
          </p>
          <div class="app-modal__stores">
            <a
              class="store-badge"
              href="{{appStoreUrl}}"
              aria-label="Download on the App Store"
            >
              <img
                src="./assets/images/stores/badge-app-store-en-dark.png"
                width="120"
                height="40"
                alt="Download on the App Store"
              />
            </a>
            <a
              class="store-badge"
              href="https://play.google.com/store/apps/details?id=com.jakob_robic.zyflowmobileapp"
              aria-label="Get it on Google Play"
            >
              <img
                src="./assets/images/stores/badge-google-play-en-dark.png"
                width="120"
                height="40"
                alt="Get it on Google Play"
              />
            </a>
          </div>
        </div>
        <div class="app-modal__qr">
          <img
            src="./assets/images/zyflow-app-qr.png"
            width="140"
            height="140"
            alt="QR code to download Zyflow on the App Store"
          />
          <img class="app-modal__qr-mark" src="./assets/design-system/logos/zyflow-mark.svg" alt="" aria-hidden="true" />
        </div>
      </div>
    </div>
  </div>
</dialog>
