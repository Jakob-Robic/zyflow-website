<div class="announcement" data-partial="announcement">
  <div class="announcement__inner">
    <span class="motif" aria-hidden="true"></span>
    <span class="announcement__label" data-i18n="chrome.announcement.label">App Update:</span>
    <span class="announcement__text announcement__text--full" data-i18n="chrome.announcement.text">Zyflow is live on iOS and Android. Plan smarter rides with battery-aware routing.</span>
    <span class="announcement__text announcement__text--short" data-i18n="chrome.announcement.textShort">Live on iOS &amp; Android</span>
    <a class="link" href="{{appStoreUrl}}" data-app-modal-open data-i18n="chrome.announcement.cta">Download</a>
  </div>
  <div class="announcement__divider" aria-hidden="true">
    <span class="section-divider__layer section-divider__layer--1"></span>
    <span class="section-divider__layer section-divider__layer--2"></span>
    <span class="section-divider__layer section-divider__layer--3"></span>
  </div>
</div>
