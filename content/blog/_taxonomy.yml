# Topics that cut across places. Give each post 1–3. The Topic filter lists them in this order,
# so keep each group together. "use" says when a tag applies; check-blog does not read it.
tags:
  # Stops: what the rider finds on the way. The core of "Know where to stop".
  - id: cafes
    group: stops
    label: { en: Cafés, sl: Kavarne }
    use: Coffee and cake stops, bakeries, places to sit for 20 minutes.
  - id: food
    group: stops
    label: { en: Food, sl: Hrana }
    use: Gostilne, restaurants and farm stays worth a proper meal.
  - id: stays
    group: stops
    label: { en: Stays, sl: Nastanitve }
    use: Hotels, guesthouses and campsites with bike storage or charging.
  - id: huts
    group: stops
    label: { en: Mountain huts, sl: Planinske koče }
    use: Huts and alpine dairies you can ride to.
  - id: charging
    group: stops
    label: { en: Charging, sl: Polnjenje }
    use: Where and how to charge an e-bike or EV on the way.
  - id: water
    group: stops
    label: { en: Water, sl: Voda }
    use: Fountains, refill points and toilets.
  - id: repairs
    group: stops
    label: { en: Repairs, sl: Servis }
    use: Bike shops, repair stations, rental and spare batteries.
  - id: viewpoints
    group: stops
    label: { en: Viewpoints, sl: Razgledi }
    use: A stop worth it for the view alone.
  - id: wine
    group: stops
    label: { en: Wine roads, sl: Vinske ceste }
    use: Wine roads, tastings and the farms along them. Never suggest drinking and riding.
  # Riding: what the route is like.
  - id: climbs
    group: riding
    label: { en: Climbs, sl: Vzponi }
    use: Passes and steep climbs, with gradients and where to rest.
  - id: cycle-paths
    group: riding
    label: { en: Cycle paths, sl: Kolesarske poti }
    use: Marked long-distance paths such as Parenzana, Drava or Alpe-Adria.
  - id: quiet-roads
    group: riding
    label: { en: Quiet roads, sl: Mirne ceste }
    use: Low-traffic roads and how to avoid the busy ones.
  - id: family
    group: riding
    label: { en: Family, sl: Družine }
    use: Short, flat or safe rides with children.
  - id: first-rides
    group: riding
    label: { en: First rides, sl: Za začetnike }
    use: For someone new to e-bikes, gravel or longer days.
  # Planning: what to know before you go.
  - id: planning
    group: planning
    label: { en: Planning, sl: Načrtovanje }
    use: How to plan a ride or a trip with Zyflow.
  - id: range
    group: planning
    label: { en: Battery range, sl: Doseg baterije }
    use: How far a battery goes, and what eats it.
  - id: borders
    group: planning
    label: { en: Border crossings, sl: Prehodi meje }
    use: Rides that cross a border, and what changes on the other side.
  - id: trains
    group: planning
    label: { en: Bike and train, sl: Kolo in vlak }
    use: Taking a bike on trains, buses and ferries.
  - id: weather
    group: planning
    label: { en: Seasons and weather, sl: Sezona in vreme }
    use: When to go, heat, rain, snow on passes, road closures.
  - id: safety
    group: planning
    label: { en: Safety, sl: Varnost }
    use: Traffic, tunnels, descents, rules of the road.
  - id: gear
    group: planning
    label: { en: Gear, sl: Oprema }
    use: What to bring and what to leave at home.
