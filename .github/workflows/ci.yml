name: CI

# Runs on pull requests and pushes to main with no repository secrets.
# test:api stubs Supabase, Brevo, and Turnstile (preview skips verification
# when TURNSTILE_SECRET_KEY is unset). build:rebuild:prod is the Vercel
# build command; MAPTILER_KEY and TURNSTILE_SITE_KEY stay unset, so tour
# maps use the OpenFreeMap fallback and the Turnstile widget is omitted.
# Node is pinned to 24, the major Vercel uses for this project (created
# after 24.x became the default). engines.node 24.x keeps deploys on it.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Install, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build
          npm run build:rebuild:prod

      - name: Test API
        run: npm run test:api

      - name: Test rebuild
        run: npm run test:rebuild
